# Render Blueprint for the VinylVault vision + pricing server (the app itself is not deployed here).
services:
  - type: web
    name: vinylvault-vision
    runtime: node
    rootDir: server
    plan: free # switch to starter (always on) before the public launch
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # paste in the Render dashboard; never commit it
      - key: DISCOGS_TOKEN
        sync: false # paste in the Render dashboard; never commit it
      - key: APP_KEY_SHA256
        # SHA-256 fingerprint of EXPO_PUBLIC_APP_KEY in the app's .env (not the key itself).
        value: "dffd50999e0616ba3fd892b8251583d0f4b4bd274db4316510cd128fca4813b1"
      - key: TRUST_PROXY
        value: "1"
